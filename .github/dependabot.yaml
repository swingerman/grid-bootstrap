version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore"
      include: "scope"